<div class="project">
  <div *ngFor="let project of projects">
    <h2>{{ project.title }}</h2>
    <p>{{ project.description }}</p>
    <p>Status: {{ project.toDo ? 'To Do' : 'Completed' }}</p>

    <button (click)="deleteProject(project.id)" id="delete">🗑 Delete</button>
    <button (click)="updateProject(project)" id="update">✏ Update</button>

    <hr />
  </div>
</div>
