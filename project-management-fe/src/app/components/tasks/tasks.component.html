<div>
  <h3>Tasks for Project {{ projectId }}</h3>
  <ul>
    <li *ngFor="let task of tasks">
      <input type="checkbox" [checked]="task.completed" (change)="task.completed = !task.completed; updateTask(task)">
      <span>{{ task.title }}</span>
      <button (click)="deleteTask(task.id)">Delete</button>
    </li>
  </ul>
  <input #taskTitle type="text" placeholder="New Task Title">
  <button (click)="addTask(taskTitle.value); taskTitle.value=''">Add Task</button>
</div>
